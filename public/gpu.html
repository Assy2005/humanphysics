<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPU依存 bot 検知 (DRM不使用)</title>
    <style>
      body { margin: 0; background: #0d1117; color: #c9d1d9; font: 14px/1.6 -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif; max-width: 720px; margin: 30px auto; padding: 0 20px; }
      h1 { font-size: 18px; }
      .verdict { font-size: 24px; font-weight: 700; margin: 8px 0; }
      .human-likely { color: #3fb950; } .suspect { color: #d29922; } .bot-likely { color: #f85149; }
      ul { padding-left: 18px; } li { color: #d29922; font-size: 13px; }
      pre { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 11.5px; overflow: auto; }
      button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>GPU依存 bot 検知 <span style="color:#8b949e;font-size:12px">physics over properties</span></h1>
    <div id="verdict" class="verdict">…計測中</div>
    <ul id="reasons"></ul>
    <button id="rerun">再計測</button>
    <h3 style="font-size:14px">生データ</h3>
    <pre id="raw">…</pre>

    <script src="gpu-detect.js"></script>
    <script>
      async function go() {
        document.getElementById('verdict').textContent = '…計測中';
        var r = await GPUDetect.run();
        window.__gpu = r;
        var v = r.score;
        var el = document.getElementById('verdict');
        el.className = 'verdict ' + v.verdict;
        el.textContent = (v.verdict === 'human-likely' ? '人間/実GPUらしい' : v.verdict === 'suspect' ? '要注意' : 'botらしい') + '  (score ' + v.humanScore + ')';
        document.getElementById('reasons').innerHTML = v.reasons.map(function (x) { return '<li>' + x + '</li>'; }).join('') || '<li style="color:#8b949e">特記なし</li>';
        document.getElementById('raw').textContent = JSON.stringify(r, null, 2);
      }
      document.getElementById('rerun').addEventListener('click', go);
      go();
    </script>
  </body>
</html>
