<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HumanPhysics — passive bot signal dashboard</title>
    <style>
      :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --muted:#8b949e; --green:#3fb950; --yellow:#d29922; --red:#f85149; --accent:#58a6ff; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif; }
      header { padding: 18px 24px; border-bottom: 1px solid var(--border); }
      h1 { font-size: 18px; margin: 0; }
      .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .sub a { color: var(--accent); text-decoration: none; }
      main { max-width: 980px; margin: 0 auto; padding: 20px; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; flex: 1 1 300px; }
      .panel h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); }
      .verdict { font-size: 28px; font-weight: 700; }
      .verdict.human-likely { color: var(--green); } .verdict.suspect { color: var(--yellow); } .verdict.bot-likely { color: var(--red); }
      .score { font-size: 13px; color: var(--muted); }
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      td { padding: 3px 6px; border-bottom: 1px solid #21262d; vertical-align: top; }
      td.k { color: var(--muted); white-space: nowrap; width: 46%; }
      td.v { font-family: "Cascadia Code", Consolas, monospace; } td.v.flag { color: var(--red); } td.v.ok { color: var(--green); }
      ul.reasons { margin: 8px 0 0; padding-left: 18px; } ul.reasons li { color: var(--yellow); font-size: 12.5px; }
      button { background: #21262d; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px; }
      .controls { display: flex; gap: 10px; margin: 14px 0; }
      pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; max-height: 320px; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <header>
      <h1>HumanPhysics <span class="sub" style="font-weight:400">passive bot signal dashboard</span></h1>
      <div class="sub">
        無操作で集める物理シグナル（Core A ＋ GPU ＋ aux）と判定をライブ表示。
        デモ: <a href="gate.html">サイトゲート</a> ・ <a href="demo.html">フォーム保護</a> ・ <a href="gpu.html">GPU検知</a>
      </div>
    </header>
    <main>
      <div class="row">
        <div class="panel" style="flex:1 1 240px">
          <h2>判定（クライアント参考値）</h2>
          <div id="verdict" class="verdict">…計測中</div>
          <div id="score" class="score"></div>
          <ul id="reasons" class="reasons"></ul>
        </div>
        <div class="panel" style="flex:2 1 460px">
          <h2>GPU依存</h2>
          <table id="gpu"></table>
        </div>
      </div>
      <div class="controls">
        <button id="rerun">再計測</button>
        <button id="export">JSON ダウンロード</button>
      </div>
      <div class="row">
        <div class="panel"><h2>Core A — 実行物理</h2><table id="coreA"></table></div>
        <div class="panel"><h2>aux — プロパティ痕跡</h2><table id="aux"></table></div>
      </div>
      <div class="panel"><h2>生データ</h2><pre id="raw">…</pre></div>
    </main>

    <script src="gpu-detect.js"></script>
    <script src="detector.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let RESULT = null;
      const fmt = (v) => v == null ? '<span class="sub">null</span>' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
      function rows(pairs) {
        return pairs.map(([k, v, flag]) => {
          const cls = flag === true ? ' class="v flag"' : flag === false ? ' class="v ok"' : ' class="v"';
          return '<tr><td class="k">' + k + '</td><td' + cls + '>' + fmt(v) + '</td></tr>';
        }).join('');
      }
      function render() {
        const v = HumanPhysics.computeVerdict(RESULT);
        const el = $('verdict');
        el.className = 'verdict ' + v.verdict;
        el.textContent = v.verdict === 'human-likely' ? '人間/実環境らしい' : v.verdict === 'suspect' ? '要注意' : 'botらしい';
        $('score').textContent = 'human score: ' + v.humanScore + ' / 100   （bot証拠 ' + v.botEvidence + '）';
        $('reasons').innerHTML = v.reasons.length ? v.reasons.map((r) => '<li>' + r + '</li>').join('') : '<li class="sub" style="color:var(--muted)">特記なし</li>';

        const a = RESULT.coreA, gpu = a.gpu || {}, gl = gpu.webgl || a.webgl || {}, wg = gpu.webgpu || {};
        $('gpu').innerHTML = rows([
          ['WebGL 対応', gl.supported, gl.supported === false],
          ['WebGL renderer', gl.renderer],
          ['WebGL ソフトレンダラ', gl.software, gl.software === true],
          ['WebGL 描画(ms)', gl.renderMs != null ? gl.renderMs : (a.webgl && a.webgl.drawMs ? a.webgl.drawMs.median : null), gl.renderMs != null && gl.renderMs > 120],
          ['WebGPU 対応', wg.supported, wg.supported === false],
          ['WebGPU アダプタ', wg.adapter, wg.adapter === false],
          ['WebGPU vendor/arch', (wg.gpuVendor || '-') + ' / ' + (wg.gpuArchitecture || '-')],
          ['WebGPU フォールバック', wg.isFallbackAdapter, wg.isFallbackAdapter === true],
          ['WebGPU 計算(ms,warm)', wg.computeMs],
        ]);
        $('coreA').innerHTML = rows([
          ['timer 実効分解能(ms)', a.timer.effectiveResolutionMs],
          ['int スループット(iter/ms)', a.compute.intThroughput],
          ['int/float 比', a.compute.intOverFloatRatio],
          ['計算ジッタ cv', a.compute.int.stats.cv],
          ['Math 精度ハッシュ', a.math.hash],
          ['rAF間隔(ms,中央)', a.scheduling.raf.median],
          ['Widevine DRM', a.drm ? (a.drm.widevine ? ('あり (' + (a.drm.widevineRobustness || 'SW') + ')') : (a.drm.widevineTimedOut ? '判定不能' : 'なし')) : '-'],
          ['HW動画復号', a.media ? (a.media.hwDecodeAny ? 'あり' : 'なし') : '-'],
        ]);
        const x = RESULT.aux;
        $('aux').innerHTML = rows([
          ['navigator.webdriver', x.webdriver, x.webdriver === true],
          ['Headless UA', x.headlessUA, x.headlessUA === true],
          ['automation グローバル', x.automationGlobals.length ? x.automationGlobals.join(', ') : '(なし)', x.automationGlobals.length > 0],
          ['CDP red-pill', x.cdpStackGetter, x.cdpStackGetter === true],
          ['エンジン詐称兆候', x.engineUAMismatch, x.engineUAMismatch === true],
          ['vendor', x.vendor],
          ['hardwareConcurrency', x.hardwareConcurrency],
          ['plugins 数', x.pluginsLength],
        ]);
        $('raw').textContent = JSON.stringify(RESULT, null, 2);
        window.__hpResult = RESULT;
      }
      async function run() { $('verdict').textContent = '…計測中'; RESULT = await HumanPhysics.runPassive(); render(); }
      $('rerun').addEventListener('click', run);
      $('export').addEventListener('click', () => {
        const b = new Blob([JSON.stringify(RESULT, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'hp-' + RESULT.ts + '.json'; a.click();
      });
      run();
    </script>
  </body>
</html>
