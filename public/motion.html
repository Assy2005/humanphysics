<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Core B v2 — モーション知覚チャレンジ (DOM/スクショ耐性)</title>
    <style>
      body { margin: 0; background: #0d1117; color: #c9d1d9; font: 14px/1.6 -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif; max-width: 640px; margin: 30px auto; padding: 0 20px; }
      h1 { font-size: 18px; }
      .hint { color: #8b949e; font-size: 12.5px; }
      #stage { height: 260px; display: flex; align-items: center; justify-content: center; background: #161b22; border: 1px solid #30363d; border-radius: 10px; margin: 14px 0; }
      button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      pre { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 11.5px; overflow: auto; max-height: 320px; }
      #status { margin-left: 12px; color: #8b949e; font-size: 12.5px; }
    </style>
  </head>
  <body>
    <h1>モーション知覚チャレンジ <span class="hint">Core B v2</span></h1>
    <div class="hint">
      点群の中で<b>同じ方向へ流れて見える成分</b>の向きを、矢印キー（←→↑↓）で答えてください。
      流れが感じられない（バラバラ）時は <b>スペース</b>。答えは<b>映像の動き</b>にしか無く、
      DOM にもスクショ1枚にも写りません（＝DOM読みbot・スクショ型エージェントは答えられない）。
    </div>
    <div id="stage" tabindex="0">準備OK</div>
    <button id="start">開始（6試行）</button><span id="status"></span>
    <h3 style="font-size:14px">結果</h3>
    <pre id="out">開始すると結果が出ます。</pre>

    <script src="detector.js"></script>
    <script>
      var $ = function (id) { return document.getElementById(id); };
      $('start').addEventListener('click', async function () {
        $('start').disabled = true;
        $('stage').focus();
        var res = await HumanPhysics.runMotionChallenge({
          rounds: 6, stage: $('stage'),
          onProgress: function (p) { $('status').textContent = p.phase === 'gap' ? ('試行 ' + (p.index + 1) + '/' + p.rounds + '：注視…') : '方向を答えて！'; },
        });
        window.__motion = res;
        $('status').textContent = '完了';
        $('out').textContent = JSON.stringify(res, null, 2);
        $('start').disabled = false;
      });
      // 自動テスト用
      window.__runMotion = function (rounds) { return HumanPhysics.runMotionChallenge({ rounds: rounds || 6, stage: $('stage') }); };
    </script>
  </body>
</html>
